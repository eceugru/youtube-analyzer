spring:
  application:
    name: YouTube Feedback Intelligence

  data:
    mongodb:
      uri: mongodb://localhost:27017/YouTube_feedback_intelligence

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 5

  web:
    resources:
      static-locations: classpath:/static/

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.ecenisaugu: DEBUG
  file:
    name: logs/youtube-feedback-intelligence.log



