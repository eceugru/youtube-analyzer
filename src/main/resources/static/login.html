<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | YouTube Analyzer</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-color: #181818;
            --text-color: #f1f1f1;
            --placeholder-color: #aaa;
            --accent-color: #ff0000;
            --note-color: #888;
            --nav-bg: #181818;
        }

        body.light {
            --bg-color: #f9f9f9;
            --card-color: #ffffff;
            --text-color: #202020;
            --placeholder-color: #666;
            --accent-color: #ff0000;
            --note-color: #555;
            --nav-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Roboto", Arial, sans-serif;
            transition: background-color 0.4s, color 0.4s;
        }

        body {
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            position: absolute;
            top: 0;
            width: 100%;
            background-color: var(--nav-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 40px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            text-decoration: none;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-size: 15px;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: #fff;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 22px;
            cursor: pointer;
            margin-left: 8px;
        }

        /* Login Box */
        .login-box {
            background-color: var(--card-color);
            padding: 40px 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            width: 360px;
            text-align: center;
            margin-top: 140px;
        }

        h2 {
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            color: var(--note-color);
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            font-size: 14px;
        }

        input::placeholder {
            color: var(--placeholder-color);
        }

        .remember {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 15px;
            color: var(--note-color);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background-color: #cc0000;
        }

        .alt {
            margin-top: 15px;
            font-size: 13px;
            color: var(--note-color);
        }

        .alt a {
            color: var(--accent-color);
            text-decoration: none;
        }

    </style>
</head>

<body>
<nav>
    <a id="logo" class="logo">YouTube Analyzer</a>
    <div class="nav-actions">
        <a id="signIn" class="btn">Login</a>
        <a id="signUp" class="btn">Sign Up</a>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>
</nav>

<div class="login-box">
    <h2>Welcome Back</h2>
    <p>Sign in to your account</p>

    <form  onsubmit="loginUser(event)" >
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>

        <div class="remember">
            <label><input type="checkbox" id="rememberMe"> Remember me</label>
            <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>

        <p class="alt">Don’t have an account? <a id="signpu">Sign up</a></p>
    </form>
</div>

<script src="js/login.js"></script>
</body>
</html>
